<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dashboard & Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* --- AUTH CARD --- */
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            width: 320px;
            text-align: center;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }
        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            border-radius: 6px;
        }
        button.submit-btn {
            width: 98%;
            padding: 12px;
            margin-top: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button.submit-btn:hover { background: #2563eb; }
        #response-message {
            margin-top: 15px;
            font-size: 0.9em;
            color: #38bdf8;
            min-height: 20px;
        }

        /* --- CHAT DASHBOARD CONTAINER --- */
        #dashboardContainer {
            display: none;
            width: 90%;
            max-width: 600px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
        }
        .dash-header {
            padding: 15px 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dash-header h3 { margin: 0; color: #38bdf8; }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover { background: #dc2626; }

        /* CHAT MESSAGES BOX */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
            font-size: 0.95em;
        }
        .message.user {
            align-self: flex-end;
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.bot {
            align-self: flex-start;
            background: #334155;
            color: #f8fafc;
            border-bottom-left-radius: 2px;
        }

        /* INPUT BAR */
        .chat-input-bar {
            padding: 15px;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
        }
        .chat-input-bar input {
            flex: 1;
            margin: 0;
            width: auto;
        }
        .chat-input-bar button {
            width: auto;
            padding: 0 20px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-bar button:hover { background: #059669; }
    </style>
</head>
<body>

    <!-- 1. AUTHENTICATION CONTAINER -->
    <div class="card" id="authContainer">
        <div class="tabs">
            <button class="tab-btn active" id="loginTab" onclick="switchMode('login')">Sign In</button>
            <button class="tab-btn" id="signupTab" onclick="switchMode('signup')">Sign Up</button>
        </div>

        <form id="authForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
        </form>

        <div id="response-message"></div>
    </div>

    <!-- 2. DASHBOARD / CHAT CONTAINER -->
    <div id="dashboardContainer">
        <div class="dash-header">
            <h3>Welcome, <span id="displayUser">User</span>!</h3>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot">Hello! Ask me anything, and I'll save our conversation log to Google Drive.</div>
        </div>

        <form class="chat-input-bar" id="chatForm">
            <input type="text" id="chatInput" placeholder="Type a message..." required autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        // ⚠️ REPLACE WITH YOUR ACTUAL RAILWAY BACKEND DOMAIN (Include https://)
        const BACKEND_URL = "https://my-ai-project-production-6c25.up.railway.app";

        let currentMode = "login";
        let currentUser = "";

        // --- AUTH MODE SWITCHING ---
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById("response-message").innerText = "";

            if (mode === "login") {
                document.getElementById("loginTab").classList.add("active");
                document.getElementById("signupTab").classList.remove("active");
                document.getElementById("submitBtn").innerText = "Sign In";
            } else {
                document.getElementById("signupTab").classList.add("active");
                document.getElementById("loginTab").classList.remove("active");
                document.getElementById("submitBtn").innerText = "Create Account";
            }
        }

        // --- AUTH FORM SUBMISSION ---
        document.getElementById("authForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const messageBox = document.getElementById("response-message");
            messageBox.innerText = currentMode === "login" ? "Logging in..." : "Creating account...";

            const endpoint = currentMode === "signup" ? "/signup" : "/login";
            const usernameInput = document.getElementById("username").value;

            try {
                const res = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: document.getElementById("password").value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    if (currentMode === "login") {
                        currentUser = usernameInput;
                        openDashboard();
                    } else {
                        messageBox.innerText = data.message;
                        setTimeout(() => switchMode("login"), 1500);
                    }
                } else {
                    messageBox.innerText = data.detail || `Error (${res.status})`;
                }
            } catch (err) {
                messageBox.innerText = "Error connecting to backend API.";
            }
        });

        // --- OPEN DASHBOARD ---
        function openDashboard() {
            document.getElementById("authContainer").style.display = "none";
            document.getElementById("dashboardContainer").style.display = "flex";
            document.getElementById("displayUser").innerText = currentUser;
        }

        // --- LOGOUT ---
        function logout() {
            currentUser = "";
            document.getElementById("dashboardContainer").style.display = "none";
            document.getElementById("authContainer").style.display = "block";
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
            document.getElementById("response-message").innerText = "";
            document.getElementById("chatBox").innerHTML = '<div class="message bot">Hello! Ask me anything, and I\'ll save our conversation log to Google Drive.</div>';
        }

        // --- CHAT FORM SUBMISSION ---
        document.getElementById("chatForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const chatInput = document.getElementById("chatInput");
            const chatBox = document.getElementById("chatBox");
            const userMsg = chatInput.value.trim();

            if (!userMsg) return;

            // Render User Message
            appendMessage(userMsg, "user");
            chatInput.value = "";

            // Render Typing Indicator
            const typingDiv = document.createElement("div");
            typingDiv.className = "message bot";
            typingDiv.id = "typingIndicator";
            typingDiv.innerText = "Gemini is thinking & saving to Drive...";
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(`${BACKEND_URL}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: currentUser,
                        message: userMsg
                    })
                });

                const data = await res.json();
                
                // Remove typing indicator
                const indicator = document.getElementById("typingIndicator");
                if (indicator) indicator.remove();

                if (res.ok) {
                    appendMessage(data.response, "bot");
                } else {
                    appendMessage("Error: Could not get AI response.", "bot");
                }
            } catch (err) {
                const indicator = document.getElementById("typingIndicator");
                if (indicator) indicator.remove();
                appendMessage("Failed to reach server.", "bot");
            }
        });

        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
