<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Login Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 320px;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            border-radius: 6px;
        }
        button {
            width: 98%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2563eb; }
        #response-message {
            margin-top: 15px;
            font-size: 0.9em;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Sign In</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Submit</button>
        </form>
        <div id="response-message"></div>
    </div>

    <script>
        // ⚠️ REPLACE THIS with your deployed Railway domain (e.g. "https://my-app.up.railway.app")
        const BACKEND_URL = "my-ai-project-production-bce0.up.railway.app";

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const messageBox = document.getElementById("response-message");
            messageBox.innerText = "Connecting to Gemini...";

            try {
                const res = await fetch(`${BACKEND_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });

                const data = await res.json();
                messageBox.innerText = data.message;
            } catch (err) {
                messageBox.innerText = "Error contacting backend API.";
            }
        });
    </script>
</body>
</html>
